[package]
name = "keri-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1.57"
futures = "0.3.24"
keri-core = { path = "../keriox_core", features = ["oobi"] }
tempfile = "3.3.0"
url = "2.2.2"
said = { version = "0.5.3-beta.1" }
teliox = {path = "../support/teliox"}
watcher = { path = "../components/watcher" }
witness = { path = "../components/witness" }
keri-controller = { path = "../components/controller" }
anyhow = "1"
serde_json = "1.0"
test-context = "0.4.1"
actix-rt = "2.10.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

[[bin]]
name = "perf_watcher"
path = "src/bin/perf_watcher.rs"

[package.metadata.release]
release = false
