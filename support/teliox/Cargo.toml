[package]
name = "teliox"
version = "0.19.0-rc.10"
description = "ACDC 2.0 state registries (TELs) anchored in KERI key event logs"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["storage-redb"]
storage-redb = ["keri-core/storage-redb", "redb"]
storage-postgres = ["keri-core/storage-postgres", "sqlx", "async-std"]

[dependencies]
keri-core = {path = "../../keriox_core", version= "0.19.0-rc.10", features = ["exchange"] }
said = { version = "=2.0.0-rc.4" }
cesrox = { version = "=2.0.0-rc.2" }
thiserror = "1.0"
chrono = "0.4.45"
# ACDC 2.0 messages, registry events and blinded state blocks.
acdc = "0.2.0"
redb = { version = "2.6.4", optional = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-async-std"], optional = true }
async-std = { version = "1", features = ["attributes"], optional = true }


[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"

[package.metadata.release]
publish = false
