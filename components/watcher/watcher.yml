db_path: "db/"
public_url: "http://localhost:3236/"
seed: "Alntkt3u6dDgiQxTATr01dy8M72uuaZEf9eTdM-70Gk8" # Private key in CESR format
                                                     # used by the watcher. If this field
                                                     # is not provided, a randomly generated
                                                     # key pair will be used.
http_port: 3236
# Admin port hosts /metrics, /health, /info. Bound to admin_bind below
# (default 127.0.0.1) so the metrics surface is not reachable from the
# public network. Comment out admin_port to disable the admin listener.
admin_port: 9101
admin_bind: "127.0.0.1"
initial_oobis: []
# Seconds an escrowed event waits for what it is missing (receipts,
# signatures, a delegator's approval) before it is dropped.
escrow_config:
  default_timeout: 900
# KERI protocol version this node writes its own messages in: "1.0" or
# "2.0" (the default); attachments are in CESR 2.0 either way. Reported on
# GET /info.
keri_version: "2.0"
# The oldest keriox release whose requests are served; older clients, and
# clients that name no release, get 426 Upgrade Required. Unset serves all.
# min_client_version: "0.20.0"
