[package]
name = "keri-sdk"
version = "0.19.0-rc.8"
description = "KERI Software Development Kit"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keri-controller = { path = "../components/controller", version = "0.19.0-rc.8" }
keri-core = { path = "../keriox_core", version = "0.19.0-rc.8", features = ["query", "oobi"] }
cesrox = { version = "=2.0.0-rc.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = { version = "0.11" }
said = { version = "=2.0.0-rc.4" }
teliox = { path = "../support/teliox", version = "0.19.0-rc.8" }
thiserror = "1.0"
log = "0.4"
rand = "0.8.8"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
p256 = { version = "0.9", features = ["ecdsa", "sha256"] }
k256 = { version = "0.9", features = ["ecdsa", "sha256"] }
base64 = "0.13"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3.27"
redb = "2.6.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
url = { version = "2.5.8", features = ["serde"] }

keri-keyprovider = { path = "../keri_keyprovider", version = "0.19.0-rc.8", optional = true, features = ["software"] }
async-std = { version = "1", optional = true }
tokio = { version = "1", features = ["time"] }

[features]
default = []
keyprovider = ["keri-keyprovider", "tokio/full"]
storage-postgres = ["keri-controller/storage-postgres", "dep:async-std"]
mobile = ["keyprovider", "keri-keyprovider/host", "keri-keyprovider/software"]

[dev-dependencies]
tokio-test = "0.4"
keri-core = { path = "../keriox_core", version = "0.19.0-rc.8" }
tokio = { version = "1", features = ["full"] }
witness = { path = "../components/witness" }
watcher = { path = "../components/watcher" }
test-context = "0.4.1"
actix-rt = "2.15.0"
# Only used by the storage-postgres test to provision its database.
sqlx = { version = "0.8", features = ["postgres", "runtime-async-std"] }
async-std = "1"

[package.metadata.release]
publish = false
