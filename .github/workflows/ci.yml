name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-features --verbose

  # --all-features includes the Postgres storage backends, whose tests need
  # a database. Skipped: postgres_identity_lifecycle and test_tel_from_watcher
  # hang, and test_kel_managing_with_witness talks to deployed witnesses.
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/keri_test
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: >-
            --all-features --verbose --
            --skip postgres_identity_lifecycle
            --skip test_tel_from_watcher
            --skip test_kel_managing_with_witness

  # The shared CESR V2 vectors: keriox reads what keripy, cesrox and the
  # specification write and accepts the same key event logs as keripy, and
  # keripy confirms what keriox writes. The keriox deployed clients run reads
  # what keriox writes by default. See test-vectors/README.md.
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the vectors against keriox
        run: cargo test -p keri-tests --test vectors --test vectors_source
      - name: Read keriox's default output with the keriox deployed clients run
        run: test-vectors/legacy-check.sh
      - uses: astral-sh/setup-uv@v5
      - name: Install libsodium for keripy
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Confirm keriox's vectors with keripy
        run: test-vectors/keripy-check.sh

  # Clients and nodes of this keriox and of the revision deployed clients
  # are built from work together over HTTP, whichever is upgraded first,
  # and nodes upgraded in place serve what they stored as before. See
  # compat/check.sh.
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check compatibility with deployed clients
        run: compat/check.sh
