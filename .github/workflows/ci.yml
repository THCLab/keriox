name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # release.yml runs the same checks on a tagged commit before publishing
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-features --verbose

  # Dependents enable only the keri-core features they need, which
  # --all-features cannot check.
  features:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build keri-core with each feature on its own
        run: keriox_core/check-features.sh

  # --all-features includes the Postgres storage backends, whose tests need
  # a database. Skipped: postgres_identity_lifecycle hangs.
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/keri_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          cargo test --all-features --verbose --
          --skip postgres_identity_lifecycle

  # The shared CESR V2 vectors: keriox reads what keripy, cesrox and the
  # specification write and accepts the same key event logs as keripy, and
  # keripy confirms what keriox writes. See test-vectors/README.md.
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the vectors against keriox
        run: cargo test -p keri-tests --test vectors --test vectors_source
      - uses: astral-sh/setup-uv@v5
      - name: Install libsodium for keripy
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Confirm keriox's vectors with keripy
        run: test-vectors/keripy-check.sh
